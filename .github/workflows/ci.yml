name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 最小権限の原則: どのジョブも GITHUB_TOKEN で書き込みを行わない
permissions:
  contents: read

jobs:
  lint:
    name: pre-commit (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install zsh (for zsh -n hook)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  syntax:
    name: make test (shellcheck + zsh -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh

      - name: Run make test
        run: make test

  package-lint:
    name: apt package names resolve (debian asset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate debian package list resolves (no install)
        # 実インストールはせず apt の依存解決のみ行い、リネーム/廃止された
        # パッケージ名 (例: Ubuntu 24.04 で削除された libncurses5-dev) を PR 時点で検出する。
        # checkinstall は単一バッチ install のため 1 つでも欠けると make init 全体が失敗する。
        # --dry-run は debconf/EULA を起動しないため ubuntu-restricted-extras も安全に検証できる。
        run: |
          sudo apt-get update
          mapfile -t pkgs < <(grep -vE '^\s*(#|$)' src/init/asset/debian)
          echo "Validating ${#pkgs[@]} packages via apt-get --dry-run ..."
          sudo apt-get install -y --dry-run "${pkgs[@]}"

  macos:
    name: macOS (make test + deploy smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck (zsh は macOS runner に同梱)
        run: brew install shellcheck

      - name: Run make test
        run: make test

      - name: Lint macOS defaults script
        run: shellcheck -x -s bash --severity=error src/init/lib/macos.sh

      - name: Deploy symlinks into a temporary HOME
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          mkdir -p "${TEST_HOME}"
          make deploy HOME="${TEST_HOME}"
          for f in .zshenv .vimrc .tmux.conf .gitconfig; do
            [ -L "${TEST_HOME}/${f}" ] || { echo "MISSING symlink: ${f}" >&2; exit 1; }
            echo "OK: ${f} -> $(readlink "${TEST_HOME}/${f}")"
          done

      - name: Idempotent re-deploy makes no backups
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          out=$(make deploy HOME="${TEST_HOME}")
          echo "${out}"
          echo "${out}" | grep -q '^backup:' && { echo "FAIL: unexpected backup on re-deploy" >&2; exit 1; }
          [ -d "${TEST_HOME}/.dotfiles_backup" ] && { echo "FAIL: backup dir created" >&2; exit 1; }
          echo "OK: idempotent on macOS"

  deploy-smoke:
    name: make deploy smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show detected dotfiles
        run: make check

      - name: Deploy symlinks into a temporary HOME
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          mkdir -p "${TEST_HOME}"
          make deploy HOME="${TEST_HOME}"

      - name: Verify symlinks were created
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          fail=0
          for f in .zshenv .vimrc .tmux.conf .gitconfig; do
            if [ -L "${TEST_HOME}/${f}" ]; then
              echo "OK: ${f} -> $(readlink "${TEST_HOME}/${f}")"
            else
              echo "MISSING symlink: ${f}" >&2
              fail=1
            fi
          done
          exit "${fail}"

      - name: Idempotent re-deploy leaves symlinks intact
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          # 2 回目の deploy はすべて "unchanged" となり、バックアップも作らない
          out=$(make deploy HOME="${TEST_HOME}")
          echo "${out}"
          if echo "${out}" | grep -q '^backup:'; then
            echo "FAIL: re-deploy unexpectedly backed up files" >&2
            exit 1
          fi
          if [ -d "${TEST_HOME}/.dotfiles_backup" ]; then
            echo "FAIL: backup dir created on idempotent re-deploy" >&2
            exit 1
          fi
          for f in .zshenv .vimrc .tmux.conf .gitconfig; do
            [ -L "${TEST_HOME}/${f}" ] || { echo "MISSING after re-deploy: ${f}" >&2; exit 1; }
          done
          echo "OK: idempotent"

      - name: Pre-existing real files are backed up, not overwritten
        run: |
          BK_HOME="${RUNNER_TEMP}/home_backup_test"
          mkdir -p "${BK_HOME}"
          echo 'my precious original vimrc' > "${BK_HOME}/.vimrc"
          make deploy HOME="${BK_HOME}"
          # .vimrc は今リポジトリへのリンクに置き換わっているはず
          [ -L "${BK_HOME}/.vimrc" ] || { echo "FAIL: .vimrc is not a symlink" >&2; exit 1; }
          # 元の実ファイルはバックアップに退避されているはず
          if ! grep -rq 'my precious original vimrc' "${BK_HOME}/.dotfiles_backup" 2>/dev/null; then
            echo "FAIL: original .vimrc was not backed up" >&2
            exit 1
          fi
          echo "OK: existing file safely backed up"

      - name: Clean unlinks our symlinks but keeps real files
        run: |
          BK_HOME="${RUNNER_TEMP}/home_backup_test"
          # 実ファイルを $HOME 直下に置く (当リポジトリのリンクではない)
          echo 'unrelated' > "${BK_HOME}/.bashrc"
          make clean HOME="${BK_HOME}"
          # 当リポジトリを指していたリンクは削除される
          [ -e "${BK_HOME}/.vimrc" ] && { echo "FAIL: symlink .vimrc not removed" >&2; exit 1; }
          # 無関係な実ファイルは残る
          [ -f "${BK_HOME}/.bashrc" ] || { echo "FAIL: unrelated file was deleted" >&2; exit 1; }
          # FORCE を付けていないのでリポジトリは残る
          [ -f Makefile ] || { echo "FAIL: repo removed without FORCE" >&2; exit 1; }
          echo "OK: clean is safe"
