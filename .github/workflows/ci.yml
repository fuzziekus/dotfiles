name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint bootstrap/init scripts
        # 既存スクリプトの style 警告で落とさず、実害のある error 相当のみ失敗させる
        run: |
          shellcheck -x -s bash --severity=error \
            src/init/install \
            src/init/init.sh \
            src/init/lib/util.sh

  deploy-smoke:
    name: make deploy smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show detected dotfiles
        run: make check

      - name: Deploy symlinks into a temporary HOME
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          mkdir -p "${TEST_HOME}"
          make deploy HOME="${TEST_HOME}"

      - name: Verify symlinks were created
        run: |
          TEST_HOME="${RUNNER_TEMP}/home"
          fail=0
          for f in .zshenv .vimrc .tmux.conf .gitconfig; do
            if [ -L "${TEST_HOME}/${f}" ]; then
              echo "OK: ${f} -> $(readlink "${TEST_HOME}/${f}")"
            else
              echo "MISSING symlink: ${f}" >&2
              fail=1
            fi
          done
          exit "${fail}"
