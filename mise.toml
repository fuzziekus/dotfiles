# このリポジトリの開発ツールを固定する (mise install で導入)。
# lint/format を全員・CI で同一バージョンに揃えるための宣言的定義。
# shfmt/shellcheck 本体は pre-commit フックが自己管理する。加えて、pre-commit を
# 介さない手元の `make test` / `mise run lint-strict` を CI と揃えるため、
# shellcheck も mise で固定しておく。
[tools]
pre-commit = "latest"
shellcheck = "0.10.0"

[tasks.lint]
description = "Run pre-commit on all files"
run = "pre-commit run --all-files"

[tasks.lint-strict]
description = "Run shellcheck at warning severity (CI は error 限定。手元での追加チェック用)"
run = """
shellcheck -x -s bash --severity=warning \
  src/init/install \
  src/init/init.sh \
  src/init/lib/util.sh \
  src/init/lib/deploy.sh \
  src/init/lib/macos.sh
"""

[tasks.test]
description = "Run repo tests (shellcheck + zsh -n)"
run = "make test"

[tasks.pre-commit-update]
description = "Update pinned pre-commit hook revisions"
run = "pre-commit autoupdate"
