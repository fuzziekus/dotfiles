# prefix keyをctrl-sに変更する

set -g prefix C-s
unbind C-b

set-option -g status on
set-option -g status-interval 1

set -g default-terminal "screen-256color"
set-option -g status-style bg="colour232"

# ペインボーダーの色を設定する
set -g pane-border-style fg=green

# アクティブなペインを目立たせる
set -g pane-active-border-style fg=blue

# message text
set-option -g message-style bg=colour245 #base02
set-option -g message-style fg=colour166 #orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# スクロールバック (コピーモードで遡れる履歴) の上限を増やす。
# デフォルトは 2000 行と狭く、少し遡るとすぐ天井に達するため大きくする。
# ※この値は設定後に生成されるペインに適用される (既存ペインは元のまま)。
set -g history-limit 100000

# セッション終了時に番号を詰める
set-option -g renumber-windows on;

# 画面分割&新規セッション時にパスを引き継ぐ
bind c new-window -c "#{pane_current_path}"
# | でペインを縦に分割する
bind | split-window -hc "#{pane_current_path}"
# - でペインを横に分割する
bind - split-window -vc "#{pane_current_path}"

# 設定ファイルをリロードする
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-s 2回でtmux 内に C-s を送る
bind C-s send-prefix

# Vim のキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモードの設定
setw -g mouse on
setw -g mode-keys vi
# ドラッグ終了時の挙動:
# - 実際にテキストを選択している場合は選択を残す (クリックで確定する現行UX)。
# - 選択ゼロの「クリックが微ドラッグ扱いになった」場合は自動でコピーモードを
#   抜ける。これをしないとペインがコピーモードに居座り、別ペインへ移動するのに
#   余計なクリックが必要になる。
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{?selection_present,0,1}" "send-keys -X cancel"
# ホイール上: 全画面 TUI (vim/less/copilot 等, alternate_on) やモード中は
# アプリ側へそのまま送る。通常シェルの時だけコピーモードに入る。
# alternate_on を見ないと TUI ペイン上のスクロールが誤ってコピーモードに突入する。
bind -n WheelUpPane if-shell -F "#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}" \
    "send-keys -M" "select-pane -t=; copy-mode -e; send-keys -M"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down
unbind -T copy-mode-vi Enter

# クリップボード連携コマンドを OS ごとに @copy_command へ集約する
# (Enter / 左クリックの両方から参照するため、ここで一元定義)
if-shell "uname | grep -q Darwin" \
    'set -g @copy_command "pbcopy"'
# Linux (xsel)
if-shell 'type xsel' \
    'set -g @copy_command "xsel -ib"'
# Wayland (wl-copy) — xsel の後に評価し、Wayland 環境では wl-copy を優先する
if-shell 'type wl-copy' \
    'set -g @copy_command "wl-copy"'
# WSL (clip.exe)
if-shell 'type clip.exe' \
    'set -g @copy_command "tmux save-buffer - | iconv -f UTF-8 -t UTF-16LE | /mnt/c/Windows/System32/clip.exe"'

# Enter で選択範囲を確定してコピー
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# 左クリックの押下 (MouseDown) では copy-mode を抜けない。
# 押下で cancel してしまうと、スクロール中に「ドラッグ選択を始めようと
# クリックした瞬間」に copy-mode が解除され、スクロール位置が最下部へ戻って
# しまう (問題の再発ポイント)。tmux はクリックとドラッグを
#   単純クリック : MouseDown -> MouseUp
#   ドラッグ     : MouseDown -> MouseDrag(begin-selection) -> MouseDragEnd
# と区別し、ドラッグ時には MouseUp が発火しない。そこで「クリックで確定/離脱」の
# 判定は MouseUp 側に置く。押下自体はペイン選択だけ行う。
bind-key -T copy-mode-vi MouseDown1Pane select-pane
# 単純クリック (ドラッグしなかった) 時の確定/離脱:
# - 直前のドラッグで選択が残っていればコピーして確定 (クリックで確定する現行UX)。
# - 選択が無ければ単にコピーモードを抜ける (別ペインへ即移動できるよう cancel)。
bind-key -T copy-mode-vi MouseUp1Pane if-shell -F "#{selection_present}" \
    'send-keys -X copy-pipe-and-cancel "#{@copy_command}"' \
    'send-keys -X cancel'

# キーボードからの vi 風コピー操作 (マウスと同じ @copy_command を使う)
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "#{@copy_command}"

###### StatusLine #######

#set -g status-left-length 20
#set -g status-left '#[fg=colour232,bg=colour255,bold] Session:#S #[fg=colour255,bg=colour232,nobold]'

set -g status-right-length 50
set -g status-right '#[fg=colour238,nobold] #[fg=colour248,bg=colour238,nobold] %Y-%m-%d |#[fg=colour252,bg=colour238,bold] %H:%M:%S #[fg=colour233,bg=colour252,bold] #H '

setw -g window-status-format "#[fg=colour250,bg=colour232,nobold] #I:#{=20:window_name} "
setw -g window-status-current-format "#[fg=colour232,bg=colour104,nobold] #[fg=colour255,bg=colour104,bold] #I:#{=20:window_name} #[fg=colour104,bg=colour232,nobold] "

