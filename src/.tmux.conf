###### サーバー(リモート/SSH)側の上書き設定 ######
# 同じ dotfile をローカル(クライアント)とリモート(サーバー)で共用する。
#
# 想定 (ネスト tmux):
#   ローカルPC の tmux (外側) = タブ/ペイン分割など UI 操作を担当。
#   リモートの tmux   (内側) = SSH が切れてもセッションが残るよう保持するのが目的。
#
# 判定: SSH 経由で起動された tmux サーバは $SSH_CONNECTION を継承しているので、
# これが在ればリモート(サーバー)側とみなす。ローカルでは空なのでこの節は走らない。
#
# プレフィックス衝突について:
#   C-s は常に外側(ローカル)が掴む。内側(リモート)を操作したい時だけ、
#   既存の `bind C-s send-prefix` を使い C-s C-s を挟む (例: デタッチは C-s C-s d)。
#   追加のキー設定は不要。
if-shell '[ -n "$SSH_CONNECTION" ]' {
    # ステータスバーはローカル(クライアント)側に表示されるため、
    # リモート側では二重表示を避けて非表示にする。
    set -g status off

    # UI 系 (ウィンドウ/ペインの生成・分割・移動・リサイズ) はローカル側で行う。
    # リモート側では誤操作防止のため無効化し、セッション保持に専念する。
    unbind c
    unbind |
    unbind -
    unbind h
    unbind j
    unbind k
    unbind l
    unbind C-h
    unbind C-l
    unbind H
    unbind J
    unbind K
    unbind L
}
###########################

###### Plugins (TPM) ######
# tmux plugin manager と、セッション永続化プラグインを宣言する。
# 初回のみ `prefix + I` でインストール (下の自動 clone で TPM 自体は導入される)。
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # セッション保存/復元

# prefix (C-s) と衝突しないよう resurrect のキーを変更
set -g @resurrect-save 'S'                      # prefix + S で手動保存
set -g @resurrect-restore 'R'                   # prefix + R で手動復元
set -g @resurrect-capture-pane-contents 'on'    # ペインの表示内容も復元
set -g @resurrect-strategy-vim 'session'        # vim のセッションを復元

# 全画面 TUI (copilot / vim / less 等, alternate screen) は内容を復元すると
# エスケープシーケンスの残骸で表示が崩れる。resurrect には「TUI だけ内容を
# 保存しない」設定が無いため、保存後 (post-save-all) に完成した書庫から
# alternate_on=1 のペインの内容だけを取り除く。これにより通常シェルは
# スクロールバックを復元しつつ、TUI ペインはクリーンなシェルで復活する。
set -g @resurrect-hook-post-save-all 'a="$(pane_contents_archive_file)"; [ -f "$a" ] || exit 0; t="$(mktemp -d)"; gzip -dc "$a" | tar xf - -C "$t"; tmux list-panes -a -f "#{alternate_on}" -F "#{session_name}:#{window_index}.#{pane_index}" | while IFS= read -r p; do rm -f "$t/pane_contents/pane-$p"; done; ( cd "$t" && tar cf - ./pane_contents/ | gzip > "$a" ); rm -rf "$t"'

# 自動保存は tmux-continuum を使わず client-detached フックで行う。
# continuum は status-right に判定スクリプトを埋め込み、status-interval ごと
# (毎秒) に fork するためマウス操作がラグる。代わりに「クライアントが
# デタッチした瞬間」= Ghostty を閉じた時 (SIGHUP でデタッチ) にだけ保存する。
set-hook -g client-detached 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

# tmux サーバ起動直後 (5 秒以内) のみ、保存済みセッションを自動復元する。
# source-file による再読み込みでは start_time が古いため復元は走らない。
if-shell '[ $(($(date +%s) - $(tmux display -p "#{start_time}"))) -le 5 ]' \
    'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"'

# TPM が未導入なら自動で clone する
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm'"

# 【重要】この行は必ずファイル末尾に置くこと
run '~/.tmux/plugins/tpm/tpm'
