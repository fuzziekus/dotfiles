# starship prompt 設定 (99_post_load.zsh で初期化)
#
# 目的: 従来の 30_prompt.zsh の見た目を概ね踏襲しつつ、starship の強み
#       (k8s などのコンテキスト自動表示・高速な git status) を得る。
#
# 従来プロンプトの構成:
#   1行目(空行) → user@host: (緑) + カレントパス (シアン)
#   2行目       → プロンプト記号 (%#。終了 0=白 / それ以外=赤〜黄)
#   右側        → git 情報 (branch/staged/unstaged/untracked/stash) + 時刻

# 各コマンドの前に空行を入れる (従来の先頭 \n 相当)
add_newline = true

# 外部コマンド (git など) のタイムアウトを延長。
# デフォルト 500ms では大きな/低速なリポジトリで git がタイムアウトし
# "Executing command ... timed out" 警告が出るため引き上げる。
command_timeout = 2000

# 左プロンプト: 1行目に user@host: パス、改行して2行目に記号
format = """
$username$hostname$directory\
$cmd_duration\
$line_break\
$character"""

# 右プロンプト: git 情報 + k8s コンテキスト + 時刻
# (従来プロンプト同様、git 情報は右側に置きコマンド入力行を短く保つ)
right_format = "$git_branch$git_status$kubernetes$time"

[username]
show_always = true
style_user = "82"              # 従来プロンプトの %F{82} に合わせる (非 bold)
style_root = "bold red"        # root のときだけ警告色
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "82"                   # 従来プロンプトの %F{82} に合わせる (非 bold)
format = "[@$hostname]($style): "

[directory]
style = "81"                   # 従来プロンプトの %F{81} に合わせる (非 bold)
truncation_length = 0          # パスを省略しない (従来の %~ 相当)
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style)"

# 従来の (git)-[branch] を踏襲 (旧 vcs_info msg0 = 緑・非 bold)
[git_branch]
symbol = ""
style = "green"
format = " [\\(git\\)-\\[$branch\\]]($style)"

[git_status]
# 旧 vcs_info msg1 (%c%u %m) は黄色だったため yellow に合わせる (非 bold)
style = "yellow"
# staged=+ / modified=- / untracked=? / stashed=:S (従来表記に合わせる)
staged = "+"
modified = "-"
untracked = "?"
stashed = ":S${count}"
ahead = "(p${count})"          # upstream 基準の先行数 (従来 pN の近似)
behind = "(b${count})"
diverged = "(p${ahead_count}b${behind_count})"
conflicted = "!"
deleted = "x"
renamed = "»"
format = ' [$all_status$ahead_behind]($style)'

[character]
# 従来は終了コードで白/黄/赤の3値だったが、starship は成功/失敗の2値。
# 成功=白(#)、失敗=赤(#) で近似。直前の終了コードは status モジュール参照。
success_symbol = "[%](bold white)"
error_symbol = "[%](bold red)"

[cmd_duration]
min_time = 3000                # 3秒以上かかったコマンドの所要時間を表示
format = " [took $duration]($style)"
style = "bold yellow"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "230"                 # 旧 RPROMPT の %F{230} に合わせる
# 直前モジュール (k8s 等) と時刻の間に区切りの空白を入れる
format = " [$time]($style)"

# --- DX 向け: コンテキストを自動表示 (関係ないディレクトリでは非表示) ---
[kubernetes]
disabled = false
symbol = "k8s:"
# namespace のみ表示 (context/cluster 名は長いため省略)
format = ' [$symbol$namespace]($style)'
style = "blue"



